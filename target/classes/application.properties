spring.application.name=sinan-api
server.port=8080

# Banco H2 em arquivo: os dados permanecem salvos entre execucoes.
spring.datasource.url=jdbc:h2:file:./data/sinan;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Evita que o navegador use uma versao antiga do formulario durante os testes.
spring.web.resources.cache.cachecontrol.no-cache=true
